# RRZE / FAU LLM-gateway credentials for Agent4CT.
#
# Copy this file to `llm_api.toml` (gitignored) and put your real key
# in it. The Kimi agent (cluster/kimi_agent.py) reads `llm_api.toml`
# at startup; the example file is just shape documentation.
#
# Source of the endpoint info:
#   https://hpc.fau.de/request-llm-api-key/

[rrze]
# Bearer token from the FAU LLM-gateway page. Looks like "sk-..." or a
# random hex string; the gateway does the validation.
api_key = "PUT-YOUR-REAL-KEY-IN-llm_api.toml-NOT-HERE"

# OpenAI-compatible base URL of the FAU gateway. Stable as of 2026-05.
base_url = "https://hub.nhr.fau.de/api/llmgw/v1"

# Which model the Kimi agent should drive. Currently the only Kimi
# variant on the gateway; other model IDs are visible via:
#   curl -s -H "Authorization: Bearer $LLMAPI_KEY" \
#     https://hub.nhr.fau.de/api/llmgw/v1/models | jq .
model = "moonshotai/Kimi-K2.6"
