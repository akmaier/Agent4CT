<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,maximum-scale=2">
  <link rel="stylesheet" type="text/css"
        href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" type="text/css"
        href="{{ '/assets/site.css' | relative_url }}">
  <title>
    {%- if page.title -%}
      {{ page.title }} · {{ site.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>
</head>
<body>
  <header class="page-header" role="banner">
    <h1 class="project-name">{{ page.title | default: site.title }}</h1>
    <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
    <a href="https://github.com/{{ site.repository }}"
       class="btn">View on GitHub</a>
    <a href="{{ '/dashboard.html' | relative_url }}"
       class="btn">Live dashboard</a>
  </header>

  <main id="content" class="main-content" role="main">
    {% include nav.html %}

    {{ content }}

    <footer class="site-footer">
      <span class="site-footer-credits">
        Agent4CT — autoresearch for CT reconstruction.
        Built on PYRO-NN; rendered with Jekyll + the Cayman theme.
      </span>
    </footer>
  </main>
</body>
</html>
